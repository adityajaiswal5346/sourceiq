# =================================================================
# Sourciq — CD Frontend Pipeline
# Deploys React app to Vercel on merge to main.
#
# Vercel handles:
#   - HTTPS (automatic TLS)
#   - CDN edge network
#   - Build caching
#   - Preview deployments on PRs (configured in vercel.json)
#
# GitHub Secrets required:
#   VERCEL_TOKEN          From vercel.com → Settings → Tokens
#   VERCEL_ORG_ID         From .vercel/project.json after first link
#   VERCEL_PROJECT_ID     From .vercel/project.json after first link
#   VITE_GOOGLE_CLIENT_ID ...apps.googleusercontent.com
#   VITE_API_BASE_URL     https://xxxx.execute-api.us-east-1.amazonaws.com/prod
# =================================================================

name: CD — Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/cd-frontend.yml"
  workflow_dispatch:

concurrency:
  group:              cd-frontend-prod
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: "Deploy frontend to Vercel"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for production
        run: |
          vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          VERCEL_ORG_ID:        ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID:    ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_BASE_URL:    ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to Vercel production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
        working-directory: frontend
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke test frontend
        env:
          PROD_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          # The deployment-specific URL from `vercel deploy` is gated by Vercel
          # Deployment Protection and returns 401 to unauthenticated requests.
          # Smoke-test the PUBLIC production alias instead — that's what users hit.
          # The alias is stored in the PRODUCTION_URL GitHub secret.
          if [ -z "$PROD_URL" ]; then
            echo "PRODUCTION_URL secret is not set — add it under repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Smoke testing production alias ..."
          STATUS=""
          for i in $(seq 1 6); do
            STATUS=$(curl -so /dev/null -w "%{http_code}" "$PROD_URL")
            echo "  Attempt $i/6 — HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "Frontend production alias returned $STATUS — expected 200"
            exit 1
          fi
          echo "Frontend smoke test passed"

      - name: Summary
        if: success()
        run: |
          echo "================================================"
          echo "  Sourciq frontend deployed"
          echo "  URL: ${{ steps.deploy.outputs.url }}"
          echo "  SHA: ${{ github.sha }}"
          echo "================================================"
