# =================================================================
# Sourciq — Anthropic Cost Monitor
# Runs daily at 09:00 UTC.
# Checks Anthropic API usage for the past 24 hours.
# Creates a GitHub issue automatically if daily spend > $3.
#
# "I manage AI APIs in production with automated cost monitoring"
# — this workflow is the proof.
# =================================================================

name: Anthropic Cost Monitor

on:
  schedule:
    - cron: "0 9 * * *"    # 09:00 UTC daily
  workflow_dispatch:

jobs:
  check-cost:
    name: "Check Anthropic daily spend"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DAILY_BUDGET_USD:  "3.00"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Check usage
        id: usage
        run: |
          python3 - <<'EOF'
          import os, sys, json, urllib.request
          from datetime import datetime, timezone

          api_key = os.environ["ANTHROPIC_API_KEY"]
          budget  = float(os.environ["DAILY_BUDGET_USD"])
          today   = datetime.now(timezone.utc).date()

          req = urllib.request.Request(
            f"https://api.anthropic.com/v1/usage?date={today}",
            headers={
              "x-api-key": api_key,
              "anthropic-version": "2023-06-01",
            }
          )
          try:
            with urllib.request.urlopen(req, timeout=10) as r:
              data = json.loads(r.read())
          except Exception as e:
            print(f"Could not fetch usage: {e}")
            with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("exceeded=false\nspend=unknown\n")
            sys.exit(0)

          daily_spend = float(data.get("total_cost", 0))
          if not daily_spend and "usage" in data:
            u = data["usage"]
            # claude-sonnet-4-5: $3/1M input, $15/1M output
            daily_spend = (u.get("input_tokens",0)*3 + u.get("output_tokens",0)*15) / 1_000_000

          exceeded = daily_spend > budget
          print(f"Date:    {today}")
          print(f"Spend:   ${daily_spend:.4f}")
          print(f"Budget:  ${budget:.2f}")
          print(f"Exceeded:{exceeded}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"exceeded={'true' if exceeded else 'false'}\n")
            f.write(f"spend={daily_spend:.4f}\n")
          EOF

      - name: Create issue if over budget
        if: steps.usage.outputs.exceeded == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const spend  = '${{ steps.usage.outputs.spend }}';
            const budget = '${{ env.DAILY_BUDGET_USD }}';
            const today  = new Date().toISOString().split('T')[0];

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              labels: ['cost-alert'],
              state:  'open',
            });

            if (existing.data.some(i => i.title.includes(today))) {
              console.log('Issue already exists for today');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `⚠️ Anthropic cost alert — $${spend} on ${today}`,
              body:  [
                '## Anthropic API Cost Alert',
                `**Date:** ${today}`,
                `**Daily spend:** $${spend}`,
                `**Budget threshold:** $${budget}`,
                '',
                '### Investigate unusual query volume',
                '```sql',
                'SELECT DATE_TRUNC(\'hour\', created_at) AS hour,',
                '       COUNT(*) AS queries,',
                '       AVG(response_ms) AS avg_ms',
                'FROM query_log',
                'WHERE created_at > NOW() - INTERVAL \'24 hours\'',
                'GROUP BY 1 ORDER BY 1 DESC;',
                '```',
                '',
                '*Auto-generated by cost monitor workflow.*',
              ].join('\n'),
              labels: ['cost-alert', 'production'],
            });

      - name: Summary
        run: |
          echo "Spend:    \$${{ steps.usage.outputs.spend }}"
          echo "Budget:   \$${{ env.DAILY_BUDGET_USD }}"
          echo "Exceeded: ${{ steps.usage.outputs.exceeded }}"
