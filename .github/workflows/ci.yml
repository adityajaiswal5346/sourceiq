# =================================================================
# Sourciq — CI Pipeline
# Runs on every push and pull request to main/develop.
#
# Jobs:
#   backend-ci  — ruff lint + format check + pytest unit tests
#   frontend-ci — TypeScript typecheck + Vite production build
#   security    — Trivy dependency scan (advisory, never blocks)
#   ragas-gate  — RAGAS eval regression (PRs only, blocks merge on failure)
#   ci-gate     — single job CD depends on
#
# Cost: ~3 min/run. GitHub free tier = 2000 min/month.
# =================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group:              ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Backend: lint + unit tests ───────────────────────────────────
  backend-ci:
    name: "Backend — lint & test"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Unit tests need no real API keys — placeholders only
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
      PINECONE_API_KEY:  ci-placeholder
      PINECONE_INDEX:    documind
      VOYAGE_API_KEY:    ci-placeholder
      COHERE_API_KEY:    ci-placeholder
      DATABASE_URL:      postgresql://test:test@localhost:5432/test
      GOOGLE_CLIENT_ID:  ci-test.apps.googleusercontent.com
      LOG_LEVEL:         WARNING

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint — ruff check
        run: cd backend && python -m ruff check . --output-format=github

      - name: Format check — ruff format
        run: cd backend && python -m ruff format . --check

      - name: Unit tests (no DB, no API calls)
        run: |
          mkdir -p test-results
          PYTHONPATH=.:backend pytest \
            tests/test_ingestion.py \
            tests/test_query_pipeline.py \
            tests/test_auth.py \
            -v --tb=short \
            --junitxml=test-results/results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 7

  # ── Frontend: typecheck + build ──────────────────────────────────
  frontend-ci:
    name: "Frontend — typecheck & build"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci

      - name: TypeScript typecheck
        run: cd frontend && npm run typecheck

      - name: Production build (verify bundle compiles)
        run: cd frontend && npm run build
        env:
          VITE_API_BASE_URL:     ""
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── Security: Trivy scan (advisory — does not block ci-gate or CD) ─
  # Logs results to the job summary only. SARIF upload to Code Scanning
  # requires GitHub Advanced Security (not enabled on this repo).
  security:
    name: "Security — Trivy"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref:  .
          severity:  CRITICAL,HIGH
          exit-code: "0"
          format:    table

  # ── RAGAS regression — blocks merge if eval metrics drop ─────────
  # Cost: ~€0.35/run with RAGAS_EVAL_LIMIT=3 (not 10 — full eval is ~€1+)
  ragas-gate:
    name: "RAGAS — eval regression"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: ragas_paths
        with:
          filters: |
            ragas:
              - 'backend/app/rag/**'
              - 'evaluation/**'
              - 'tests/test_ragas_regression.py'
              - 'backend/app/core/config.py'

      - name: Set up Python 3.12
        if: steps.ragas_paths.outputs.ragas == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.ragas_paths.outputs.ragas == 'true'
        run: pip install -r backend/requirements-dev.txt

      - name: RAGAS regression — blocks merge on metric drop
        if: steps.ragas_paths.outputs.ragas == 'true'
        env:
          RAGAS_EVAL_LIMIT:     "3"
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          PINECONE_API_KEY:     ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX:       documind
          VOYAGE_API_KEY:       ${{ secrets.VOYAGE_API_KEY }}
          COHERE_API_KEY:       ${{ secrets.COHERE_API_KEY }}
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          LANGFUSE_PUBLIC_KEY:  ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY:  ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL:    https://cloud.langfuse.com
          CONFIDENCE_THRESHOLD: "0.6"
          HYBRID_ALPHA:         "0.7"
          TOP_K_RETRIEVAL:      "10"
          TOP_K_RERANK:         "5"
          CLAUDE_MODEL:         claude-sonnet-4-5
        run: |
          PYTHONPATH=.:backend pytest \
            tests/test_ragas_regression.py \
            -v --tb=short -s

  # ── Gate: CD depends on this ─────────────────────────────────────
  ci-gate:
    name: "CI passed"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, ragas-gate]
    if: always()
    steps:
      - name: Verify required jobs passed
        run: |
          backend="${{ needs.backend-ci.result }}"
          frontend="${{ needs.frontend-ci.result }}"
          ragas="${{ needs.ragas-gate.result }}"
          echo "backend-ci:  $backend"
          echo "frontend-ci: $frontend"
          echo "ragas-gate:  $ragas"
          if [[ "$backend" != "success" || "$frontend" != "success" ]]; then
            echo "CI failed — CD blocked"
            exit 1
          fi
          # RAGAS only runs on PRs — skipped on push is fine
          if [[ "$ragas" == "failure" ]]; then
            echo "RAGAS regression failed — merge blocked"
            exit 1
          fi
          echo "All CI checks passed"
