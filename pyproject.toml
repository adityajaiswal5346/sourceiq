[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath   = [".", "backend"]
markers = [
    "ragas: expensive RAGAS regression against live APIs (~2 min)",
]

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pyright]
include = ["backend", "tests"]
extraPaths = ["backend"]
venvPath = "."
venv = ".venv"


